<div id="phone-overlay" class="phone-overlay">
    <div class="phone-container">
        <div class="phone-notch"></div>
        
        <div class="phone-status-bar">
            <div class="status-time" id="phone-status-time">12:00</div>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="phone-screen">
            <div class="phone-home" id="phone-home">
                <div class="phone-wallpaper"></div>
                
                <div class="phone-apps">
                    <div class="app-grid">
                        <div class="app-item" data-app="wechat">
                            <div class="app-icon" style="background: linear-gradient(135deg, #07c160, #05a650);">
                                <span>💬</span>
                            </div>
                            <div class="app-name">微信</div>
                        </div>
                        <div class="app-item" data-app="calendar">
                            <div class="app-icon" style="background: linear-gradient(135deg, #ff6b6b, #ee5a52);">
                                <span>📅</span>
                            </div>
                            <div class="app-name">日历</div>
                        </div>
                        <div class="app-item" data-app="photos">
                            <div class="app-icon" style="background: linear-gradient(135deg, #ff9ff3, #f368e0);">
                                <span>🖼️</span>
                            </div>
                            <div class="app-name">相册</div>
                        </div>
                        <div class="app-item" data-app="notes">
                            <div class="app-icon" style="background: linear-gradient(135deg, #feca57, #ff9f43);">
                                <span>📝</span>
                            </div>
                            <div class="app-name">备忘录</div>
                        </div>
                        <div class="app-item" data-app="weather">
                            <div class="app-icon" style="background: linear-gradient(135deg, #48dbfb, #0abde3);">
                                <span>🌤️</span>
                            </div>
                            <div class="app-name">天气</div>
                        </div>
                        <div class="app-item" data-app="music">
                            <div class="app-icon" style="background: linear-gradient(135deg, #ff6348, #ff4757);">
                                <span>🎵</span>
                            </div>
                            <div class="app-name">音乐</div>
                        </div>
                        <div class="app-item" data-app="settings">
                            <div class="app-icon" style="background: linear-gradient(135deg, #8395a7, #636e72);">
                                <span>⚙️</span>
                            </div>
                            <div class="app-name">设置</div>
                        </div>
                        <div class="app-item" data-app="calculator">
                            <div class="app-icon" style="background: linear-gradient(135deg, #5f27cd, #341f97);">
                                <span>🔢</span>
                            </div>
                            <div class="app-name">计算器</div>
                        </div>
                    </div>
                </div>

                <div class="phone-dock">
                    <div class="dock-item" data-app="wechat">
                        <div class="dock-icon" style="background: linear-gradient(135deg, #07c160, #05a650);">
                            <span>💬</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="photos">
                        <div class="dock-icon" style="background: linear-gradient(135deg, #ff9ff3, #f368e0);">
                            <span>🖼️</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="music">
                        <div class="dock-icon" style="background: linear-gradient(135deg, #ff6348, #ff4757);">
                            <span>🎵</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="settings">
                        <div class="dock-icon" style="background: linear-gradient(135deg, #8395a7, #636e72);">
                            <span>⚙️</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="phone-app-content" id="phone-app-content">
                <div class="app-header">
                    <button class="back-button" id="back-button">←</button>
                    <span class="app-title" id="app-title"></span>
                </div>
                <div class="app-body" id="app-body"></div>
            </div>
        </div>

        <div class="phone-home-indicator">
            <button class="home-button" id="home-button"></button>
        </div>
    </div>
</div>
