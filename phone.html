<div id="phone-overlay" class="phone-overlay">
    <div class="phone-container">
        <div class="phone-status-bar">
            <div class="status-time" id="phone-status-time">12:00</div>
            <div class="status-icons">
                <span class="status-icon">📶</span>
                <span class="status-icon">🔋</span>
            </div>
        </div>
        
        <div class="phone-screen" id="phone-screen">
            <div class="phone-home" id="phone-home">
                <div class="phone-wallpaper"></div>
                <div class="phone-apps">
                    <div class="app-grid">
                        <div class="app-item" data-app="wechat">
                            <div class="app-icon wechat-icon">
                                <span class="app-emoji">💬</span>
                            </div>
                            <div class="app-name">微信</div>
                        </div>
                        <div class="app-item" data-app="calendar">
                            <div class="app-icon calendar-icon">
                                <span class="app-emoji">📅</span>
                            </div>
                            <div class="app-name">日历</div>
                        </div>
                        <div class="app-item" data-app="photos">
                            <div class="app-icon photos-icon">
                                <span class="app-emoji">🖼️</span>
                            </div>
                            <div class="app-name">相册</div>
                        </div>
                        <div class="app-item" data-app="notes">
                            <div class="app-icon notes-icon">
                                <span class="app-emoji">📝</span>
                            </div>
                            <div class="app-name">备忘录</div>
                        </div>
                        <div class="app-item" data-app="weather">
                            <div class="app-icon weather-icon">
                                <span class="app-emoji">🌤️</span>
                            </div>
                            <div class="app-name">天气</div>
                        </div>
                        <div class="app-item" data-app="music">
                            <div class="app-icon music-icon">
                                <span class="app-emoji">🎵</span>
                            </div>
                            <div class="app-name">音乐</div>
                        </div>
                        <div class="app-item" data-app="settings">
                            <div class="app-icon settings-icon">
                                <span class="app-emoji">⚙️</span>
                            </div>
                            <div class="app-name">设置</div>
                        </div>
                        <div class="app-item" data-app="clock">
                            <div class="app-icon clock-icon">
                                <span class="app-emoji">⏰</span>
                            </div>
                            <div class="app-name">时钟</div>
                        </div>
                        <div class="app-item" data-app="calculator">
                            <div class="app-icon calculator-icon">
                                <span class="app-emoji">🔢</span>
                            </div>
                            <div class="app-name">计算器</div>
                        </div>
                        <div class="app-item" data-app="browser">
                            <div class="app-icon browser-icon">
                                <span class="app-emoji">🌐</span>
                            </div>
                            <div class="app-name">浏览器</div>
                        </div>
                        <div class="app-item" data-app="camera">
                            <div class="app-icon camera-icon">
                                <span class="app-emoji">📷</span>
                            </div>
                            <div class="app-name">相机</div>
                        </div>
                        <div class="app-item" data-app="maps">
                            <div class="app-icon maps-icon">
                                <span class="app-emoji">🗺️</span>
                            </div>
                            <div class="app-name">地图</div>
                        </div>
                    </div>
                </div>
                <div class="phone-dock">
                    <div class="dock-item" data-app="phone">
                        <div class="app-icon phone-app-icon">
                            <span class="app-emoji">📞</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="messages">
                        <div class="app-icon messages-icon">
                            <span class="app-emoji">✉️</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="wechat">
                        <div class="app-icon wechat-dock-icon">
                            <span class="app-emoji">💬</span>
                        </div>
                    </div>
                    <div class="dock-item" data-app="music">
                        <div class="app-icon music-dock-icon">
                            <span class="app-emoji">🎵</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="phone-app-content" id="phone-app-content">
                <div class="app-header" id="app-header">
                    <button class="back-button" id="back-button">←</button>
                    <span class="app-title" id="app-title"></span>
                </div>
                <div class="app-body" id="app-body"></div>
            </div>
        </div>
        
        <div class="phone-home-indicator">
            <button class="home-button" id="home-button"></button>
        </div>
    </div>
</div>
